name: Build LumIA Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'lumia-java-source.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract original LumIA project
        shell: pwsh
        run: |
          if (!(Test-Path "lumia-java-source.zip")) {
            throw "Envie o arquivo lumia-java-source.zip para a raiz do repositório."
          }
          Expand-Archive -Path "lumia-java-source.zip" -DestinationPath "$env:RUNNER_TEMP\lumia-src" -Force
          $project = Get-ChildItem "$env:RUNNER_TEMP\lumia-src" -Directory -Recurse |
            Where-Object { (Test-Path (Join-Path $_.FullName "src\br\com\lumia\Server.java")) -and (Test-Path (Join-Path $_.FullName "lumia-desktop.jar")) } |
            Select-Object -First 1
          if (!$project) { throw "O ZIP precisa conter a pasta lumia-java com src\br\com\lumia\Server.java e lumia-desktop.jar." }
          "LUMIA_PROJECT=$($project.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile Windows launcher and create self-contained installer
        shell: pwsh
        run: |
          $p = $env:LUMIA_PROJECT
          $pkg = "$env:RUNNER_TEMP\lumia-package"
          $classes = "$env:RUNNER_TEMP\lumia-launcher-classes"
          New-Item -ItemType Directory -Force -Path "$pkg\lib", $classes | Out-Null
          Copy-Item "$p\lumia-desktop.jar" "$pkg\"
          Copy-Item "$p\lumia-servidor.jar" "$pkg\"
          Copy-Item "$p\lib\*.jar" "$pkg\lib\"
          @'
          package br.com.lumia;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import javax.swing.JOptionPane;
          public final class Launcher {
              public static void main(String[] args) {
                  try {
                      Path data = Path.of(System.getProperty("user.home"), "AppData", "Local", "LumIA");
                      Files.createDirectories(data);
                      System.setProperty("user.dir", data.toString());
                  } catch (Exception e) {
                      JOptionPane.showMessageDialog(null, "Não foi possível preparar a pasta de dados do LumIA: " + e.getMessage(), "LumIA", JOptionPane.ERROR_MESSAGE);
                      System.exit(1);
                  }
                  Thread server = new Thread(() -> {
                      try { Server.main(new String[]{"--demo"}); }
                      catch (Exception e) { e.printStackTrace(); }
                  }, "LumIA-Local-Server");
                  server.setDaemon(false);
                  server.start();
                  boolean ready = false;
                  for (int i = 0; i < 60; i++) {
                      try {
                          HttpURLConnection c = (HttpURLConnection)new URL("http://127.0.0.1:8080/").openConnection();
                          c.setConnectTimeout(500);
                          c.setReadTimeout(500);
                          c.getResponseCode();
                          c.disconnect();
                          ready = true;
                          break;
                      } catch (Exception ignored) {
                          try { Thread.sleep(500); } catch (InterruptedException e) { Thread.currentThread().interrupt(); break; }
                      }
                  }
                  if (!ready) {
                      JOptionPane.showMessageDialog(null, "O servidor local do LumIA não iniciou. Verifique se a porta 8080 está livre.", "LumIA", JOptionPane.ERROR_MESSAGE);
                      System.exit(1);
                  }
                  Desktop.main(new String[0]);
              }
          }
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\Launcher.java"
          $cp = "$pkg\lumia-desktop.jar;$pkg\lumia-servidor.jar;$pkg\lib\*"
          javac --release 17 -encoding UTF-8 -cp $cp -d $classes "$env:RUNNER_TEMP\Launcher.java"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar o inicializador." }
          @"
          Manifest-Version: 1.0
          Main-Class: br.com.lumia.Launcher
          Class-Path: lumia-desktop.jar lumia-servidor.jar lib/gson-2.11.0.jar lib/mariadb-java-client-3.5.3.jar lib/h2-2.3.232.jar

          "@ | Set-Content -Encoding ASCII "$env:RUNNER_TEMP\launcher-manifest.mf"
          jar --create --file "$pkg\lumia-launcher.jar" --manifest "$env:RUNNER_TEMP\launcher-manifest.mf" -C $classes .
          if ($LASTEXITCODE -ne 0) { throw "Falha ao empacotar o inicializador." }
          jpackage --type exe --name LumIA --app-version 0.6.1 --vendor "Projeto LumIA" --input $pkg --main-jar lumia-launcher.jar --main-class br.com.lumia.Launcher --dest dist --win-menu --win-shortcut --win-dir-chooser --java-options "-Dfile.encoding=UTF-8"
          if ($LASTEXITCODE -ne 0) { throw "jpackage falhou ao gerar o instalador." }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LumIA-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
