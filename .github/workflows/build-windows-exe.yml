name: Build LumIA Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'lumia-java-source.zip'
      - '.github/workflows/build-windows-exe.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract original LumIA project
        shell: pwsh
        run: |
          if (!(Test-Path "lumia-java-source.zip")) {
            throw "Arquivo lumia-java-source.zip não encontrado na raiz do repositório."
          }
          Expand-Archive -Path "lumia-java-source.zip" -DestinationPath "$env:RUNNER_TEMP\lumia-src" -Force
          $project = Get-ChildItem "$env:RUNNER_TEMP\lumia-src" -Directory -Recurse |
            Where-Object { Test-Path (Join-Path $_.FullName "src\br\com\lumia\Server.java") } |
            Select-Object -First 1
          if (!$project) { throw "Não encontrei src\br\com\lumia\Server.java dentro do ZIP." }
          "LUMIA_PROJECT=$($project.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile launcher and package
        shell: pwsh
        run: |
          $p = $env:LUMIA_PROJECT
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\lumia-package\lib" | Out-Null
          Copy-Item "$p\lumia-desktop.jar" "$env:RUNNER_TEMP\lumia-package\"
          Copy-Item "$p\lumia-servidor.jar" "$env:RUNNER_TEMP\lumia-package\"
          Copy-Item "$p\lib\*.jar" "$env:RUNNER_TEMP\lumia-package\lib\"
          @'
          package br.com.lumia;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import javax.swing.JOptionPane;
          public final class Launcher {
              public static void main(String[] args) {
                  Thread server = new Thread(() -> {
                      try { Server.main(new String[]{"--demo"}); }
                      catch (Exception e) { e.printStackTrace(); }
                  }, "LumIA-Local-Server");
                  server.setDaemon(false);
                  server.start();
                  boolean ready = false;
                  for (int i = 0; i < 60; i++) {
                      try {
                          HttpURLConnection c = (HttpURLConnection)new URL("http://127.0.0.1:8080/").openConnection();
                          c.setConnectTimeout(500);
                          c.setReadTimeout(500);
                          c.getResponseCode();
                          c.disconnect();
                          ready = true;
                          break;
                      } catch (Exception ignored) {
                          try { Thread.sleep(500); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }
                      }
                  }
                  if (!ready) {
                      JOptionPane.showMessageDialog(null, "O servidor local do LumIA não iniciou. Consulte os logs.", "LumIA", JOptionPane.ERROR_MESSAGE);
                      System.exit(1);
                  }
                  Desktop.main(new String[0]);
              }
          }
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\Launcher.java"
          javac --release 17 -encoding UTF-8 -cp "$env:RUNNER_TEMP\lumia-package\lumia-desktop.jar;$env:RUNNER_TEMP\lumia-package\lumia-servidor.jar;$env:RUNNER_TEMP\lumia-package\lib\*" -d "$env:RUNNER_TEMP\lumia-package" "$env:RUNNER_TEMP\Launcher.java"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar o inicializador." }
          jpackage --type exe --name LumIA --app-version 0.6.1 --vendor "Projeto LumIA" --input "$env:RUNNER_TEMP\lumia-package" --main-jar lumia-desktop.jar --main-class br.com.lumia.Launcher --dest dist --win-menu --win-shortcut --win-dir-chooser --java-options "-Dfile.encoding=UTF-8"
          if ($LASTEXITCODE -ne 0) { throw "jpackage falhou ao gerar o instalador." }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LumIA-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
