name: Build LumIA Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Extract Java source package
        shell: pwsh
        run: |
          git show ec6619267e560cbd65d345d07358ac96a6c3ddba:lumia-java-source.zip > lumia-java-source.zip
          Expand-Archive -Path lumia-java-source.zip -DestinationPath source -Force
          $root = Get-ChildItem source -Directory | Select-Object -First 1
          if (-not $root) { throw "Pasta fonte não encontrada no ZIP." }
          Copy-Item "$($root.FullName)/*" "." -Recurse -Force
          Remove-Item gemini-local.properties -ErrorAction SilentlyContinue
          Remove-Item LOGINS_E_ACESSOS.txt -ErrorAction SilentlyContinue
      - name: Compile application
        shell: cmd
        run: compilar.bat
      - name: Package desktop and demo server launchers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item lumia-desktop.jar dist/
          Copy-Item lumia-servidor.jar dist/
          Copy-Item lib dist/lib -Recurse
          Copy-Item resources/logo.jpeg dist/
          jpackage --type app-image --name LumIA --input dist --main-jar lumia-desktop.jar --main-class br.com.lumia.Desktop --dest release
          jpackage --type app-image --name LumIA-Servidor-Demo --input dist --main-jar lumia-servidor.jar --main-class br.com.lumia.Server --arguments "--demo" --dest release
          Compress-Archive -Path release/LumIA,release/LumIA-Servidor-Demo -DestinationPath LumIA-Windows-v0.6.1-x64.zip -Force
      - name: Upload Windows executable package
        uses: actions/upload-artifact@v4
        with:
          name: LumIA-Windows-v0.6.1-x64
          path: LumIA-Windows-v0.6.1-x64.zip
          if-no-files-found: error
      - name: Publish GitHub release on version tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LumIA-Windows-v0.6.1-x64.zip
          generate_release_notes: true
